name: PWABuilder & Unified Store Deploy

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: '対象のPWA URL (例: https://ss752723.stars.ne.jp/app19/)'
        required: true
        default: 'https://ss752723.stars.ne.jp/app19/'

jobs:
  # ==========================================
  # 1. Android (Google Play)
  # ==========================================
  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App via Bubblewrap
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-android
          # 非対話環境でのプロンプト停止を防ぐため < /dev/null を付与
          npx @bubblewrap/cli init \
            --manifest "${PWA_URL}manifest.json" \
            --directory pwabuilder-android \
            --skip \
            --packageId "com.app.app19" \
            --name "App19" \
            --appShortName "App19" \
            --defaultLanguage "ja" \
            --navigationColor "#000000" \
            --themeColor "#000000" \
            --backgroundColor "#ffffff" \
            --startUrl "${PWA_URL}" \
            --icon "${PWA_URL}icon.png" < /dev/null
            
          cd pwabuilder-android
          bubblewrap build

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - run: gem install fastlane

      - name: Upload to Google Play Store
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_DATA" > google_key.json
          AAB_PATH=$(find pwabuilder-android -name "*.aab" | head -n 1)
          
          fastlane run upload_to_play_store \
            json_key:"google_key.json" \
            package_name:"com.app.app19" \
            aab:"$AAB_PATH" \
            track:"internal" \
            skip_upload_images:true \
            skip_upload_screenshots:true

  # ==========================================
  # 2. iOS / iPhone (TestFlight)
  # ==========================================
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate iOS Wrapper via PWABuilder
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-ios
          npx @pwabuilder/cli generate ios --url "$PWA_URL" --directory pwabuilder-ios || true

      - name: Set up Ruby & Fastlane
        run: gem install fastlane

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$ASC_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          
          IPA_PATH=$(find pwabuilder-ios -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Notice: IPA file not found. Skipping TestFlight upload placeholder."
            exit 0
          fi
          
          fastlane run upload_to_testflight \
            ipa:"$IPA_PATH" \
            api_key_path:"~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

  # ==========================================
  # 3. Windows (Microsoft Store)
  # ==========================================
  deploy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Windows Package
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          echo "Generating Windows package for: ${{ github.event.inputs.pwa_url }}"

      - name: Publish to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          product-id: ${{ secrets.MS_APP_ID }}
          tenant-id: ${{ secrets.MS_TENANT_ID }}
          client-id: ${{ secrets.MS_CLIENT_ID }}
          client-secret: ${{ secrets.MS_CLIENT_SECRET }}
          package-path: 'path/to/your-app.msix'
