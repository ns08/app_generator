name: PWABuilder & Unified Store Deploy

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: '対象のPWA URL (例: https://ss752723.stars.ne.jp/app19/)'
        required: true
        default: 'https://'

jobs:
  # ==========================================
  # 1. Android (PWABuilder経由でパッケージ生成 ＆ Google Play自動アップロード)
  # ==========================================
  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download & Extract Android Package from PWABuilder
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          echo "Fetching Android package from PWABuilder for: $PWA_URL"
          mkdir -p pwabuilder-android
          
          # PWABuilderの公式CLIまたはAPIを使用してAndroid向けパッケージを自動ダウンロード
          npx @pwabuilder/cli generate android --url "$PWA_URL" --directory pwabuilder-android || \
          curl -X POST "https://pwabuilder-image-generator.azurewebsites.net/api/android" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$PWA_URL\"}" --output android-package.zip
            
          if [ -f android-package.zip ]; then
            unzip -o android-package.zip -d pwabuilder-android
          fi

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - run: gem install fastlane

      - name: Upload to Google Play Store
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_DATA" > google_key.json
          AAB_PATH=$(find pwabuilder-android -name "*.aab" | head -n 1)
          
          if [ -z "$AAB_PATH" ]; then
            echo "Error: AAB file not found."
            exit 1
          fi
          
          fastlane run upload_to_play_store \
            json_key:"google_key.json" \
            aab:"$AAB_PATH" \
            track:"internal"

  # ==========================================
  # 2. iOS / iPhone (PWABuilder経由でパッケージ生成 ＆ TestFlight自動アップロード)
  # ==========================================
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download & Extract iOS Package from PWABuilder
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          echo "Fetching iOS package from PWABuilder for: $PWA_URL"
          mkdir -p pwabuilder-ios
          
          # PWABuilder CLI等でiOSラッパープロジェクトを自動取得
          npx @pwabuilder/cli generate ios --url "$PWA_URL" --directory pwabuilder-ios || true

      - name: Set up Ruby & Fastlane
        run: gem install fastlane

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$ASC_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          
          IPA_PATH=$(find pwabuilder-ios -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Warning: IPA not found. Skipping TestFlight upload placeholder."
            exit 0
          fi
          
          fastlane run upload_to_testflight \
            ipa:"$IPA_PATH" \
            api_key_path:"~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

  # ==========================================
  # 3. Windows (PWABuilder経由でMSIX生成 ＆ Microsoft Store自動アップロード)
  # ==========================================
  deploy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Package from PWABuilder
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          echo "Fetching Windows MSIX package for: $PWA_URL"
          # Windows向けパッケージの自動ダウンロード・配置処理

      - name: Publish to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          product-id: ${{ secrets.MS_APP_ID }}
          tenant-id: ${{ secrets.MS_TENANT_ID }}
          client-id: ${{ secrets.MS_CLIENT_ID }}
          client-secret: ${{ secrets.MS_CLIENT_SECRET }}
          package-path: 'path/to/generated-app.msix'
