name: PWABuilder & Unified Store Deploy

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: '対象のPWA URL (例: https://ss752723.stars.ne.jp/app19/)'
        required: true
        default: 'https://ss752723.stars.ne.jp/app19/'

jobs:
  # ==========================================
  # 1. Android (Google Play)
  # ==========================================
  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App via Bubblewrap
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-android
          npm install -g @bubblewrap/cli
          
          # echo "n" をパイプで流し込んで「JDKを自動インストールするか？」の質問に自動でNoと答えて対話抜けする
          echo "n" | bubblewrap init \
            --manifest "${PWA_URL}manifest.json" \
            --directory pwabuilder-android \
            --skip \
            --packageId "com.app.app19" \
            --name "App19" \
            --appShortName "App19" \
            --defaultLanguage "ja" \
            --navigationColor "#000000" \
            --themeColor "#000000" \
            --backgroundColor "#ffffff" \
            --startUrl "${PWA_URL}" \
            --icon "${PWA_URL}icon.png" || true
            
          cd pwabuilder-android
          bubblewrap build
  # ==========================================
  # 2. iOS / iPhone (TestFlight)
  # ==========================================
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate iOS Wrapper
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-ios
          # iOS向けに Capacitor を使ったラッパー生成を行う例
          npx @capacitor/cli init App com.app.app19 --web-dir www || true

      - name: Set up Ruby & Fastlane
        run: gem install fastlane

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$ASC_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Notice: IPA file not found. Skipping TestFlight upload."
            exit 0
          fi
          
          fastlane run upload_to_testflight \
            ipa:"$IPA_PATH" \
            api_key_path:"~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

  # ==========================================
  # 3. Windows (Microsoft Store)
  # ==========================================
  deploy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Windows Package
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          echo "Generating Windows package for: ${{ github.event.inputs.pwa_url }}"

      - name: Publish to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          product-id: ${{ secrets.MS_APP_ID }}
          tenant-id: ${{ secrets.MS_TENANT_ID }}
          client-id: ${{ secrets.MS_CLIENT_ID }}
          client-secret: ${{ secrets.MS_CLIENT_SECRET }}
          package-path: 'path/to/your-app.msix'
