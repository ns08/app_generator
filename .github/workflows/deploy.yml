name: PWABuilder & Strict Unified Store Deploy

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: '対象のPWA URL (例: https://ss752723.stars.ne.jp/app19/)'
        required: true
        default: 'https://ss752723.stars.ne.jp/app19/'

jobs:
  # ==========================================
  # 1. Android (Google Play Store)
  # ==========================================
  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App via Bubblewrap
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-android
          npm install -g @bubblewrap/cli
          
          # expect をインストールして、Y/n 検出時に自動で "y" を送信
          sudo apt-get update && sudo apt-get install -y expect
          
          expect -c "
            set timeout 300
            spawn bubblewrap init --manifest \"${PWA_URL}manifest.json\" --directory pwabuilder-android --skip --packageId \"com.app.app19\" --name \"App19\" --appShortName \"App19\" --defaultLanguage \"ja\" --navigationColor \"#000000\" --themeColor \"#000000\" --backgroundColor \"#ffffff\" --startUrl \"${PWA_URL}\" --icon \"${PWA_URL}icon.png\"
            
            expect {
              -re \"\\?.*(install the JDK|install the Android SDK|.*Y/n.*)\" {
                send \"y\r\"
                exp_continue
              }
              eof
            }
          "
            
          cd pwabuilder-android
          bubblewrap build

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - run: gem install fastlane

      - name: Upload to Google Play Store
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_DATA" > google_key.json
          AAB_PATH=$(find pwabuilder-android -name "*.aab" | head -n 1)
          
          if [ -z "$AAB_PATH" ]; then
            echo "Error: AAB file could not be found. Build may have failed."
            exit 1
          fi
          
          fastlane run upload_to_play_store \
            json_key:"google_key.json" \
            package_name:"com.app.app19" \
            aab:"$AAB_PATH" \
            track:"internal" \
            skip_upload_images:true \
            skip_upload_screenshots:true

  # ==========================================
  # 2. iOS / iPhone (App Store Connect / TestFlight)
  # ==========================================
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate iOS Wrapper via Capacitor
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir -p pwabuilder-ios
          cd pwabuilder-ios
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npx cap init App com.app.app19 --web-dir .
          npx cap add ios

      - name: Set up Ruby & Fastlane
        run: gem install fastlane

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$ASC_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file not found for TestFlight upload."
            exit 1
          fi
          
          fastlane run upload_to_testflight \
            ipa:"$IPA_PATH" \
            api_key_path:"~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

  # ==========================================
  # 3. Windows (Microsoft Store)
  # ==========================================
  deploy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Windows MSIX Package via PWABuilder
        env:
          PWA_URL: ${{ github.event.inputs.pwa_url }}
        run: |
          mkdir pwabuilder-windows
          cd pwabuilder-windows
          
          npx @pwabuilder/windows generate ^
            --url "${PWA_URL}" ^
            --name "App19" ^
            --packageId "com.app.app19" ^
            --version "1.0.0.0" ^
            --autogeneratedtrue

      - name: Publish to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          product-id: ${{ secrets.MS_APP_ID }}
          tenant-id: ${{ secrets.MS_TENANT_ID }}
          client-id: ${{ secrets.MS_CLIENT_ID }}
          client-secret: ${{ secrets.MS_CLIENT_SECRET }}
          package-path: 'pwabuilder-windows/**/*.msix'
