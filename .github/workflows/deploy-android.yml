name: Deploy to Google Play

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Fastlane & Supply
        run: |
          gem install fastlane

      - name: Authenticate and Upload to Play Store
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          # 秘密鍵をファイルとして書き出す
          echo "$GOOGLE_PLAY_JSON_KEY_DATA" > google_key.json
          
          # FastlaneのsupplyコマンドでGoogle Playへアップロード（内部テストトラックの例）
          fastlane run upload_to_play_store \
            json_key:"google_key.json" \
            package_name:"com.your.appname" \
            aab:"path/to/your-app.aab" \
            track:"internal"
